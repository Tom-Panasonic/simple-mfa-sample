AWSTemplateFormatVersion: "2010-09-09"
Description: Simple email OTP MFA sample (S3 + existing CloudFront + Lambda Function URL + SES)

# CloudFront は新しく作らず、既存のディストリビューションに /<BasePath>/* の振る舞いを足して使う。
# 振る舞いの追加・削除は scripts/distribution.mjs が行う（既存のディストリビューションは
# このスタックの管理外のため、CloudFormation では扱えない）。

Parameters:
  MailFrom:
    Type: String
    Description: SES で検証済みの送信元メールアドレス
  AdminKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: 登録画面で使う管理用キー
  AppSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: セッショントークン署名と認証コードのハッシュに使う秘密値
  DistributionId:
    Type: String
    Description: 相乗りする既存の CloudFront ディストリビューションの ID
  BasePath:
    Type: String
    AllowedPattern: "^/[a-z0-9-]+$"
    Description: このサンプルを置くパス（例 /mfa-sample）

Resources:
  # React のビルド成果物を置くバケット（非公開。既存の CloudFront からだけ読める）
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  # DB の代わりに db.json を1つ置くバケット（非公開。Lambda からだけ読み書きする）
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FunctionLogGroup.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/db.json"
              # ListBucket があると、db.json が無いときに AccessDenied ではなく NoSuchKey になる
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref MailFrom

  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Simple MFA sample - login, OTP verify, resend, user registration
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          MAIL_FROM: !Ref MailFrom
          ADMIN_KEY: !Ref AdminKey
          APP_SECRET: !Ref AppSecret
          BASE_PATH: !Ref BasePath
      # 本物のコードは deploy スクリプトが update-function-code で差し替える
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: 'not deployed yet' });

  AuthFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AuthFunction
      AuthType: NONE

  # 認証なしの Function URL を公開するには、InvokeFunctionUrl と
  # 「Function URL 経由に限った InvokeFunction」の2つの許可が必要
  AuthFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AuthFunctionInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteBucketDomainName:
    Value: !GetAtt SiteBucket.RegionalDomainName
  DataBucketName:
    Value: !Ref DataBucket
  FunctionName:
    Value: !Ref AuthFunction
  FunctionUrl:
    Value: !GetAtt AuthFunctionUrl.FunctionUrl
